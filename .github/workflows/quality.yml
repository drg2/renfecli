name: Quality Gate

# The Go counterpart of a black/ruff/mypy pipeline, plus the checks Go needs
# that Python does not: a tidy go.mod, the race detector, and a coverage floor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLANGCI_VERSION: v2.12.2

jobs:
  format-and-vet:
    name: gofmt + go vet + tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt (black --check equivalent)
        run: make fmt
      - name: go vet
        run: make vet
      - name: go.mod is tidy
        run: make tidy-check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - run: '"$(go env GOPATH)/bin/golangci-lint" run ./cmd/... ./internal/...'

  # The tests run on every OS a release ships for. They are portable Go — no
  # make, which windows-latest does not carry — and the race detector comes
  # along, since a scheduler bug is exactly the kind that shows on one platform
  # and not another.
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: tests with the race detector
        run: go test -race ./...
      - name: build the CLI
        run: go build ./cmd/renfe
      - name: the CLI answers for itself
        run: go run ./cmd/renfe version

  # One number, measured once: running the floor on three platforms would
  # report the same figure three times.
  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make cover-check
      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
