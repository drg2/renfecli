name: Security Gate

# bandit → gosec (run through golangci-lint, which also emits SARIF)
# pip-audit → govulncheck, which additionally does reachability analysis
# plus module-checksum verification and a CycloneDX SBOM.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency that is safe today can be vulnerable next week, so the gate
    # runs on a timer as well as on changes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  GOLANGCI_VERSION: v2.12.2
  CYCLONEDX_VERSION: v1.9.0

jobs:
  sast:
    name: SAST (gosec) + SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # only for uploading the SARIF report
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - name: golangci-lint (gosec, staticcheck, errcheck…) → SARIF
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run \
            --output.sarif.path golangci.sarif \
            ./cmd/... ./internal/...
      - name: upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: golangci.sarif
          category: golangci-lint

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: known vulnerabilities in dependencies and toolchain
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  supply-chain:
    name: module integrity + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: verify module checksums
        run: go mod verify
      - name: CycloneDX SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${{ env.CYCLONEDX_VERSION }}
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -licenses -json -output sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
