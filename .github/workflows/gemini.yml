name: Gemini

on:
  workflow_dispatch:

jobs:
  gemini:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: latest
          prompt: |
            Analiza este repositorio.
            No modifiques ningún archivo todavía.
            Explícame brevemente cómo está estructurado,
            cómo funciona el scraper de Renfe y cómo se ejecuta.
